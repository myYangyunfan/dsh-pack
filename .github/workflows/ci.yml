name: CI

# 三道门禁：静态审计（含 P0 的 publish-readiness）→ 单测 → 真装真组合的集成校验。
# 集成校验必须有 windows-latest：原生预编译和 win32 的 sharp 可选依赖只在那里被真正走到。

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static:
    name: 静态审计（8 项门禁）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      # --ignore-scripts：pnpm 11 默认拦依赖的 install 脚本，静态审计与单测都不需要
      # 原生构建（sharp / node-gyp-build 那类）。需要真装原生包的是 J3，它单独跑。
      # 不加这个会让 pnpm install 直接以 ERR_PNPM_IGNORED_BUILDS 失败。
      # --filter '!@dsh-pack/all'：第二层保险。主修是 pnpm-workspace.yaml 的
      # linkWorkspacePackages: true —— 它让元包那 24 个「自家指自家」的依赖链到 workspace 目录，
      # lock 里不再有 @dsh-pack 的 registry 条目可取（@dsh-pack 尚未发布，取必 ERR_PNPM_FETCH_404）。
      # 这条 filter 让 install 连元包那个 importer 都不必展开；静态审计与单测只读源码 + 根 devDeps，
      # 真按 registry 语义验证是 J1/J2 的活（它们自带临时 home）。理由见 RELEASE_RUNBOOK。
      - run: pnpm install --frozen-lockfile=false --ignore-scripts --filter '!@dsh-pack/all'
      - name: 生成/刷新官方内核快照
        run: |
          node -e "const v=require('./tools/audit/dsh-runtime.json').runtimeVersion;console.log('kernel',v)" \
            && npm i --no-audit --no-fund --ignore-scripts --prefix "$RUNNER_TEMP/kernel" \
               "@deepseek-ai/dsh@$(node -p "require('./tools/audit/dsh-runtime.json').runtimeVersion")"
          node tools/audit/extract-kernel-snapshots.mjs "$RUNNER_TEMP/kernel/node_modules"
      - name: node tools/audit/index.js
        run: node tools/audit/index.js
      # 发布物内容门禁：npm pack 真实产物，离线可跑。
      # 目前会因 dsh-side-session / dsh-super-injector 缺 LICENSE 而红 —— 那是
      # 真实的发布阻塞（BSD-3 需上游原文、@dsh-external 出处未核实），
      # 不许用白名单把它静音；补齐出处或决定不发布这两个包之后自然转绿。
      - name: node tools/itest/pack-audit.mjs
        run: node tools/itest/pack-audit.mjs

  unit:
    name: 单测
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      # --ignore-scripts：pnpm 11 默认拦依赖的 install 脚本，静态审计与单测都不需要
      # 原生构建（sharp / node-gyp-build 那类）。需要真装原生包的是 J3，它单独跑。
      # 不加这个会让 pnpm install 直接以 ERR_PNPM_IGNORED_BUILDS 失败。
      # --filter '!@dsh-pack/all'：第二层保险。主修是 pnpm-workspace.yaml 的
      # linkWorkspacePackages: true —— 它让元包那 24 个「自家指自家」的依赖链到 workspace 目录，
      # lock 里不再有 @dsh-pack 的 registry 条目可取（@dsh-pack 尚未发布，取必 ERR_PNPM_FETCH_404）。
      # 这条 filter 让 install 连元包那个 importer 都不必展开；静态审计与单测只读源码 + 根 devDeps，
      # 真按 registry 语义验证是 J1/J2 的活（它们自带临时 home）。理由见 RELEASE_RUNBOOK。
      - run: pnpm install --frozen-lockfile=false --ignore-scripts --filter '!@dsh-pack/all'
      # 集成/单测都强制把 DSH_HOME 指到临时目录；这里显式清空，防止继承到真实路径
      - name: node --test
        run: node --test "packages/*/test/*.test.js" "packages/*/test/*.test.mjs"
        env:
          DSH_HOME: ''

  itest:
    name: 集成 J1+J2（真装 + 组合 + tarball 启动）
    needs: [static]
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      # 这两个 job 必须有 pnpm：内核的 `dsh plugin add` 是 shell 出去调 pnpm 的，
      # 光有 actions/setup-node 时 runner 上没有 pnpm，J1 第一步就报
      # 'pnpm' is not recognized as an internal or external command（2026-10-19 CI 实测）。
      # 版本与 static/unit 对齐，别一个 job pnpm 11.7、另一个 pnpm 10。
      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: 缓存官方内核
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/kernel
          key: kernel-${{ matrix.os }}-${{ hashFiles('tools/audit/dsh-runtime.json') }}
      - name: 装一份干净内核（从 npm，不用 vendored tarball）
        run: |
          npm i --no-audit --no-fund --ignore-scripts --prefix "$RUNNER_TEMP/kernel" \
            "@deepseek-ai/dsh@$(node -p "require('./tools/audit/dsh-runtime.json').runtimeVersion")"
        shell: bash
      - name: J1 组合校验
        run: node tools/itest/boot-desktop-profile.mjs --job=j1
        env:
          DSH_KERNEL_BIN: ${{ runner.temp }}/kernel/node_modules/@deepseek-ai/dsh/lib/bin.js
      - name: J2 tarball 安装 + 启动冒烟
        run: node tools/itest/boot-desktop-profile.mjs --job=j2
        env:
          DSH_KERNEL_BIN: ${{ runner.temp }}/kernel/node_modules/@deepseek-ai/dsh/lib/bin.js

  itest-builds:
    name: 集成 J3（pnpm 构建脚本放行流程）
    needs: [static]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      # 同 itest：J3 验的就是 pnpm 的构建脚本放行流程，runner 上没有 pnpm 只会得到
      # 'pnpm' is not recognized，夹具原生依赖根本没机会被走到。
      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: 装一份干净内核
        run: |
          npm i --no-audit --no-fund --ignore-scripts --prefix "$RUNNER_TEMP/kernel" \
            "@deepseek-ai/dsh@$(node -p "require('./tools/audit/dsh-runtime.json').runtimeVersion")"
        shell: bash
      - name: J3 断言 pendingBuilds 文案与 allowBuilds 恢复
        run: node tools/itest/boot-desktop-profile.mjs --job=j3
        env:
          DSH_KERNEL_BIN: ${{ runner.temp }}/kernel/node_modules/@deepseek-ai/dsh/lib/bin.js
