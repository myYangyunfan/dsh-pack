name: Release

# 发版唯一入口：changesets 驱动，合并到 main 时版本化并 pnpm -r publish。
# 不再有 NSIS / makensis / 签名密钥 / tauri.conf.json 版本交叉校验——
# 本仓库已不产出任何可执行程序。
#
# 「版本号要三处同步」这个旧坑随之消失：版本号的唯一来源就是 changesets 的一次 version 提交。
#
# 注意：旧的 Electron 时代 release.yml 历史上有过 `false && A || B` 造成「假短路」的事故，
# 那份流水线是**删除**而不是原地改写；要恢复任何发版形态请重新写清楚门禁。

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write
  id-token: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version:
    name: 版本化 / 汇总发布 PR
    runs-on: ubuntu-latest
    outputs:
      published: ${{ steps.ver.outputs.changesets_published }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: pnpm
      - run: pnpm install --frozen-lockfile=false

      # 发布前必须过全部静态门禁；任一条红都不许出版本
      - name: 发布门禁 node tools/audit/index.js
        run: node tools/audit/index.js

      - name: 生成版本变更集 PR
        id: ver
        uses: changesets/action@v1
        with:
          install: pnpm install --frozen-lockfile=false
          version: pnpm changeset version
          publish: pnpm -r publish --access public --tag latest --no-git-checks
          commit: 'chore(release): 版本变更集'
          title: 'chore(release): 版本变更集'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # 预发布通道：手动触发，打 beta tag，给用户先试。
  # 目的很具体——官方客户端有强制更新策略，内核会在我们不参与时前进；
  # 需要先有一个能让用户验证「新内核下还挂得上」的通道。
  prerelease:
    name: 预发布（beta tag）
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: pnpm
      - run: pnpm install --frozen-lockfile=false
      - run: node tools/audit/index.js
      - run: pnpm -r publish --access public --tag beta --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
