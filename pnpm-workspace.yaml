# DSH Pack 的 workspace 定义。
#
# 这里刻意和「用户 profile 的 pnpm-workspace.yaml」保持同一套语义
# （那边实测是 packages:[.] / nodeLinker:hoisted / autoInstallPeers:false），
# 这样本地装出来的解析行为、以及 pnpm 11 拦构建脚本的行为，才和用户机上命中的一致。
# 用 npm 会让这一整类问题从 CI 里漏过去。
packages:
  - 'packages/*'

nodeLinker: hoisted
autoInstallPeers: false

# pnpm 11 的供应链年龄门禁只对外部包有意义：@dsh-pack/* 是我们自己的包，
# 每次发版都是刚发布，落在 24h 窗口里必然被判违规（CI 实测 ERR_PNPM_MINIMUM_RELEASE_AGE_VIOLATION）。
minimumReleaseAgeExclude:
  - '@dsh-pack/*'

# 元包与成员之间的引用在本仓内闭环：成员就是同一 workspace 里的目录，链接它们而不是去
# registry 取（@dsh-pack 尚未发布，取必 404）。成员对外部包与内核 peer 的解析仍走 registry，
# 与用户 profile 的语义一致；这里只改「自家指自家」这一段。
linkWorkspacePackages: true
